name: Import and validate FLARE HD
on:
  push:
    branches: [v16.0.1-character-validation]
    paths: ['scripts/import_flare_hd.py', '.github/workflows/flare-hd-import.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/v16.0.1-character-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/import_flare_hd.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright phaser@3.90.0
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p artifacts && node --check preview/game.js && node --check preview/flare.js && KOA_REQUIRE_HD=1 node tests/browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flare-hd-screenshots
          path: artifacts/
          if-no-files-found: ignore
      - name: Commit validated local assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/assets/flare/hd-*.png preview/flare-hero-data.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "16.0.2 import validated high-resolution FLARE hero atlases"
          git push origin HEAD:v16.0.1-character-validation
