name: Browser quality gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright phaser@3.90.0
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p artifacts && node --check game.js && node --check preview/game.js && node --test tests/local-server.cjs && node tests/browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: artifacts/
          if-no-files-found: ignore
