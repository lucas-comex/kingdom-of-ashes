name: Godot Reborn - import and smoke test
on:
  push:
    branches: [godot-reborn]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: godot-reborn
  cancel-in-progress: false
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - run: |
          if [ ! -f assets/imported/map.json ]; then python scripts/import_assets.py; fi
      - name: Install Godot 4.4.1 (compatibility renderer)
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
      - name: Import and test
        run: |
          Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --import 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|Parse Error' /tmp/import.log; then exit 1; fi
          timeout 45 Godot_v4.4.1-stable_linux.x86_64 --headless --path . -- --smoke 2>&1 | tee /tmp/smoke.log
          grep 'REBORN SMOKE PASS' /tmp/smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed' /tmp/smoke.log; then exit 1; fi
      - name: Capture rendered prototype
        run: |
          mkdir -p artifacts
          KOA_SCREENSHOT="$PWD/artifacts/reborn.png" timeout 60 xvfb-run -a Godot_v4.4.1-stable_linux.x86_64 --path . --rendering-method gl_compatibility -- --capture
          test -s artifacts/reborn.png
      - name: Build standalone browser version
        run: |
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p /tmp/koa-templates "$HOME/.local/share/godot/export_templates/4.4.1.stable" artifacts/web
          unzip -q /tmp/templates.tpz -d /tmp/koa-templates
          cp /tmp/koa-templates/templates/web* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          Godot_v4.4.1-stable_linux.x86_64 --headless --path . --export-release Web "$PWD/artifacts/web/index.html" 2>&1 | tee /tmp/export.log
          test -s artifacts/web/index.html && test -s artifacts/web/index.wasm && test -s artifacts/web/index.pck
      - name: Package Godot project
        run: |
          mkdir -p artifacts
          zip -qr artifacts/Kingdom-of-Ashes-Reborn.zip project.godot export_presets.cfg world characters interface assets README.md .gitignore -x '*.import' '*.uid'
      - uses: actions/upload-artifact@v4
        with:
          name: Kingdom-of-Ashes-Reborn
          path: artifacts/
      - name: Commit validated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/imported
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import validated Godot Reborn prototype art"
          git push origin HEAD:godot-reborn
