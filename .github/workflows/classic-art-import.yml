name: Import Classic Reborn artwork
on:
  push:
    branches: [v22-classic-visual-overhaul]
    paths: ['scripts/import_classic22.py','.github/workflows/classic-art-import.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/v22-classic-visual-overhaul'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/import_classic22.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright phaser@3.90.0
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p artifacts && node --check preview/game.js && node --check preview/classic.js && KOA_REQUIRE_CLASSIC=1 node tests/browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classic-reborn-browser-screenshots
          path: artifacts/
          if-no-files-found: ignore
      - name: Commit validated assets to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/assets/classic preview/classic-data.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "22.0 import verified Classic Reborn landscape and layered avatars"
          git push origin HEAD:v22-classic-visual-overhaul
