<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kingdom of Ashes — contas locais</title><style>body{max-width:540px;margin:40px auto;padding:20px;background:#171b16;color:#dfd0ae;font:16px system-ui}h1{font-family:Georgia}label{display:block;margin:12px 0}input,button{font:inherit;padding:8px;max-width:100%}button{margin:5px}a{color:#dfc17b}small{display:block;color:#b9ae95}</style><h1>Kingdom of Ashes</h1><p>Servidor de desenvolvimento local. Não é multiplayer e não aceita pagamentos.</p><form id="auth"><label>Usuário<input id="username" required minlength="3" maxlength="24" autocomplete="username"></label><label>Senha<input type="password" id="password" required minlength="12" maxlength="128" autocomplete="current-password"></label><button value="login">Entrar</button><button value="register">Criar conta local</button></form><section id="vault" hidden><h2>Backup privado</h2><p>Envie o arquivo exportado pelo jogo. O progresso offline não é validado por servidor de combate.</p><input type="file" id="file" accept="application/json,.json"><button id="upload">Enviar backup</button><button id="download">Baixar backup</button><button id="logout">Sair</button></section><p id="notice" role="status"></p><a href="/preview/">Voltar ao jogo</a><script>
const $=id=>document.getElementById(id);async function api(path,method='GET',data){const r=await fetch('/api/'+path,{method,headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw Error(j.error);return j}function state(user){$('auth').hidden=!!user;$('vault').hidden=!user;$('notice').textContent=user?'Conta local: '+user:''}function err(e){$('notice').textContent='Erro: '+e.message}
$('auth').onsubmit=async e=>{e.preventDefault();try{const j=await api(e.submitter?.value||'login','POST',{username:$('username').value,password:$('password').value});state(j.username)}catch(e){err(e)}finally{$('password').value=''}};
$('upload').onclick=async()=>{try{const f=$('file').files[0];if(!f||f.size>2097152)throw Error('Selecione um backup de até 2 MB.');await api('save','PUT',JSON.parse(await f.text()));$('notice').textContent='Backup salvo.'}catch(e){err(e)}};
$('download').onclick=async()=>{try{const j=await api('save');if(!j.backup)throw Error('Nenhum backup disponível.');const u=URL.createObjectURL(new Blob([JSON.stringify(j.backup,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='kingdom-of-ashes-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(e){err(e)}};
$('logout').onclick=async()=>{try{await api('logout','POST',{});state(null)}catch(e){err(e)}};api('me').then(j=>state(j.username)).catch(()=>state(null));
</script></html>
